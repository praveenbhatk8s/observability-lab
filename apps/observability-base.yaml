# Namespace and shared secrets for the observability stack.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability-base
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/praveenbhatk8s/observability-lab
    targetRevision: main
    path: platform/base
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
