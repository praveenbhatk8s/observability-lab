# Grafana datasources as labelled ConfigMaps, loaded by the Grafana sidecar.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana-provisioning
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/praveenbhatk8s/observability-lab
    targetRevision: main
    path: platform/grafana/provisioning
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
