# Mimir, monolithic mode: every component in one process, data on one volume.
# Based on the official "Get started" demo config. Not for production.
target: all
multitenancy_enabled: false

server:
  http_listen_port: 9009
  grpc_listen_port: 9095
  log_level: warn

# Mimir writes some files relative to its working directory by default, which
# isn't writable when it runs as a non-root user. Point them at the volume.
activity_tracker:
  filepath: /data/metrics-activity.log

blocks_storage:
  backend: filesystem
  filesystem:
    dir: /data/blocks
  bucket_store:
    sync_dir: /data/tsdb-sync
  tsdb:
    dir: /data/tsdb

compactor:
  data_dir: /data/compactor
  sharding_ring:
    kvstore:
      store: memberlist

distributor:
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: memberlist

ingester:
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: memberlist
    replication_factor: 1

store_gateway:
  sharding_ring:
    replication_factor: 1

ruler:
  rule_path: /data/ruler

ruler_storage:
  backend: filesystem
  filesystem:
    dir: /data/rules

limits:
  # Keep the lab's disk use bounded.
  compactor_blocks_retention_period: 7d
